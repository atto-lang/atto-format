name: Maybe and keyword try exact-head formatter gate
on:
  push:
    branches:
      - 'integration/**'
      - 'ci/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/maybe_try_keyword.rs'
      - 'tests/imperative_try_blocks.rs'
      - '.github/workflows/maybe-try-exact-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formatter-maybe-try:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout local repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record exact commit and Git tree
        run: |
          printf 'commit=%s\n' "$(git rev-parse HEAD)"
          printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
      - name: Targeted formatter tests
        run: cargo test --test maybe_try_keyword --test imperative_try_blocks
      - name: Full formatter tests
        run: cargo test
