name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: indiebuild-linux-arm64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Exact formatter tree: $(git rev-parse HEAD^{tree})"
          sha256sum contracts/v1/type-declarations-conformance-v1.tsv
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo fmt --all -- --check
      - run: cargo test --test type_only_declarations
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: python3 -m unittest discover -s scripts -p 'test_compiler_parity.py'
      - run: python3 -m unittest discover -s scripts -p 'test_compiler_ast_parity.py'
      - run: python3 -m unittest discover -s scripts -p 'test_audit_compiler_tip_format.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_private_ci_visibility.py'
      - run: cargo clippy --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - run: cargo build --release --bins

  msrv:
    runs-on: indiebuild-linux-arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Exact formatter tree: $(git rev-parse HEAD^{tree})"
          sha256sum contracts/v1/type-declarations-conformance-v1.tsv
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.85.0
      - run: cargo test --all-targets
