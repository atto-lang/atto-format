name: Callable header formatter conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  header-conformance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR/branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout SHA and tree
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Run golden, fail-closed and standalone verification tests
        run: |
          node --version
          node --test tests/*.test.mjs
      - name: Run native Rust method spelling regression
        run: cargo test --locked --offline --test method_spelling_forward_port
      - name: Pipeline match delimiter and idempotence regression
        run: cargo test --locked --offline --lib match_switch::tests::preserves_pipeline_match_outer_delimiters_and_mixed_arm_commas
      - name: Real compiler conformance must not be inferred from JS-only checks
        run: |
          echo "Node golden tests are not a real parser/guest ABI proof."
          echo "Private exact-tree carrier CI must set ATTOC and run actual Rust compiler comparisons."
