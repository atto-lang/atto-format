name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [indiebuild-linux-arm64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify original PR head and physical checkout bytes
        env:
          EXPECTED_HEAD: ${{ env.EXPECTED_SHA }}
        run: bash scripts/verify_ci_checkout_head.sh
      - name: Test adversarial checkout-identity controls
        run: python3 -m unittest discover -s tests -p 'test_ci_checkout_head_20261106.py' -v
      - run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Exact formatter tree: $(git rev-parse HEAD^{tree})"
          sha256sum contracts/v1/type-declarations-conformance-v1.tsv
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo fmt --all -- --check
      - run: cargo test --test type_only_declarations
      - run: cargo test --test cli_compiler_tip_corpus
      - name: Focused return spacing library regressions
        run: cargo test --test return_spacing
      - name: Return spacing CLI safety regressions
        run: cargo test --test return_spacing_cli
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: python3 -m unittest discover -s scripts -p 'test_compiler_parity.py'
      - run: python3 -m unittest discover -s scripts -p 'test_compiler_ast_parity.py'
      - run: python3 -m unittest discover -s scripts -p 'test_formatter_acceptance_delta.py'
      - run: python3 -m unittest discover -s scripts -p 'test_audit_compiler_tip_formatter.py'
      - run: python3 -m unittest discover -s tests -p 'test_private_ci_visibility.py'
      - run: cargo clippy --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - run: cargo build --release --bins

  msrv:
    runs-on: [indiebuild-linux-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify original PR head and physical checkout bytes
        env:
          EXPECTED_HEAD: ${{ env.EXPECTED_SHA }}
        run: bash scripts/verify_ci_checkout_head.sh
      - name: Test adversarial checkout-identity controls
        run: python3 -m unittest discover -s tests -p 'test_ci_checkout_head_20261106.py' -v
      - run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Exact formatter tree: $(git rev-parse HEAD^{tree})"
          sha256sum contracts/v1/type-declarations-conformance-v1.tsv
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.85.0
      - name: Focused return spacing library regressions
        run: cargo test --test return_spacing
      - name: Return spacing CLI safety regressions
        run: cargo test --test return_spacing_cli
      - run: cargo test --all-targets

  wasm-conformance:
    # PR validation only. No credentials persist and no binary is published.
    runs-on: [indiebuild-linux-arm64]
    timeout-minutes: 25
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify original PR head and physical checkout bytes
        env:
          EXPECTED_HEAD: ${{ env.EXPECTED_SHA }}
        run: bash scripts/verify_ci_checkout_head.sh
      - name: Verify exact source head and clean Git tree
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo "Wasm test source head: $(git rev-parse HEAD)"
          echo "Wasm test source tree: $(git rev-parse HEAD^{tree})"
      - name: Test adversarial checkout-identity controls
        run: python3 -m unittest discover -s tests -p 'test_ci_checkout_head_20261106.py' -v
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build standalone formatter Wasm
        env:
          # Match the canonical browser publishing build's size/ABI flags.
          RUSTFLAGS: '-C opt-level=z -C panic=abort'
        run: cargo build --release --lib --target wasm32-unknown-unknown --offline
      - name: Execute formatter Wasm API regressions
        run: node tests/browser-wasm.mjs
