name: Sequence bang spacing (host only)
on:
  pull_request:
    paths:
      - 'src/caret-sequences.mjs'
      - 'tests/sequence-bang-spacing.test.mjs'
      - '.github/workflows/sequence-return-revision-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact tested head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Run focused host tests (not compiler parity)
        run: node --test tests/sequence-bang-spacing.test.mjs tests/stdio-is-adt-patterns.test.mjs
