name: Pair and lexical aggregate capture formatter
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify candidate SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Run focused capture and Pair regression
        run: cargo test --locked --offline --lib pair_capture_v3_tests
      - name: Full formatter library regression
        run: cargo test --locked --offline --lib
